{% extends "web/base.html" %}
{% load static %}
{% block title %}Thank You | Artisans-Verse{% endblock %}
{% block content %}
<section class="av-section">
  <div class="av-container" style="max-width:620px; text-align:center;">
    <div class="av-card" style="padding:48px 32px;" data-reveal>
      <div
        style="width:64px; height:64px; border-radius:50%; background:var(--av-success-soft); color:var(--av-success); display:inline-flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:18px;">
        <i class="fas fa-check"></i>
      </div>
      <h1 style="font-size:2rem; margin-bottom:10px;">Thank You for Supporting Local Artisans</h1>
      <p style="color:var(--av-ink-muted); margin-bottom:26px;">Your order has been confirmed and the artisan workshop
        has been notified.</p>
      <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
        <a href="{% url 'user_orders' %}" class="av-btn av-btn-primary">View My Orders</a>
        <a href="{% url 'shop' %}" class="av-btn av-btn-outline">Continue Shopping</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
